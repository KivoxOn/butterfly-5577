
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Butterfly 5577 — StarterScripts</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: #ddd;
  font-family: "Courier New", monospace;
}

header {
  padding: 28px 20px;
  border-bottom: 1px solid #292929;
}

header h1 {
  font-size: 21px;
  letter-spacing: 4px;
  font-weight: normal;
  color: white;
}

.path {
  color: #777;
  font-size: 12px;
  margin-top: 12px;
}

main {
  max-width: 850px;
  margin: 35px auto;
  padding: 0 20px;
}

.toolbar {
  color: #888;
  font-size: 12px;
  padding-bottom: 15px;
  border-bottom: 1px solid #292929;
  margin-bottom: 20px;
}

.files {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 15px;
}

.file {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 145px;
  padding: 15px;
  border: 1px solid #292929;
  background: #101010;
  color: #ccc;
  text-decoration: none;
  text-align: center;
  transition: 0.2s;
}

a.file:hover {
  background: #1b1b1b;
  border-color: #777;
  color: white;
}

.file-icon {
  font-size: 36px;
  margin-bottom: 15px;
}

.file-name {
  font-size: 12px;
  overflow-wrap: anywhere;
}

.file-type {
  color: #666;
  font-size: 10px;
  margin-top: 8px;
}

.locked {
  opacity: 0.65;
  cursor: default;
  border-style: dashed;
}

footer {
  text-align: center;
  color: #444;
  font-size: 11px;
  padding: 35px 10px;
}
</style>
</head>

<body>

<header>
  <h1>BUTTERFLY 5577</h1>
  <div class="path">
    LOCATION: /STARTERSCRIPTS/
  </div>
</header>

<main>

  <div class="toolbar">
    FILE MANAGER — 5 ITEMS
  </div>

  <div class="files">

    <a class="file" href="fly.png" target="_blank">
      <div class="file-icon">▦</div>
      <div class="file-name">fly.png</div>
      <div class="file-type">PNG IMAGE</div>
    </a>

    <a class="file" href="Butter.jpeg" target="_blank">
      <div class="file-icon">▧</div>
      <div class="file-name">butter.jpeg</div>
      <div class="file-type">JPEG IMAGE</div>
    </a>

    <a class="file" href="Morse%20Code.png" target="_blank">
      <div class="file-icon">▦</div>
      <div class="file-name">Morse Code.png</div>
      <div class="file-type">PNG IMAGE</div>
    </a>

    <a class="file" href="secret.txt" target="_blank">
      <div class="file-icon">▤</div>
      <div class="file-name">secret.txt</div>
      <div class="file-type">TEXT DOCUMENT</div>
    </a>

    <div class="file locked">
      <div class="file-icon">▣</div>
      <div class="file-name">Encrypted.encry</div>
      <div class="file-type">UNKNOWN FORMAT</div>
    </div>

  </div>

</main>

<footer>
  BUTTERFLY 5577 — ARCHIVE 002
</footer>

</body>
</html>
